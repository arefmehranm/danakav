# nginx config for the danakav.ir backend-free demo (static SPA).
#
# Copy this into your server's nginx `server { }` block (or use the bundled
# Dockerfile). It serves the built SPA with hash routing, caches the hashed
# assets, and forwards the «تحلیل هوش مصنوعی» calls to TSFM.ai / OpenRouter.
#
# Why the /ai/* proxy exists: TSFM.ai sends no CORS headers, so the browser
# cannot call it cross-origin, and the upstream API keys must not be shipped in
# the page. nginx injects the Authorization header, so the page only ever talks
# to this origin. Same pattern as the repo's frontend/docker/nginx.conf; edit
# the keys below to rotate them.
server {
    listen 80;
    listen [::]:80;
    server_name danakav.ir www.danakav.ir;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # --- AI services (same-origin proxy, keys injected here) ---------------
    location ^~ /ai/tsfm/ {
        proxy_pass https://api.tsfm.ai/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tsfm.ai;
        proxy_set_header Authorization "Bearer sk-627ab902c9286d873643d2045a1d76dd52626708";
        proxy_set_header Content-Type $http_content_type;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /ai/llm/ {
        proxy_pass https://openrouter.ai/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host openrouter.ai;
        proxy_set_header Content-Type $http_content_type;
        # OpenRouter returns very large response headers (CORS allow-lists),
        # which overflow the default 4k/8k buffers and cause a 502.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- static assets ------------------------------------------------------
    # Hashed build assets never change under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|png|jpe?g|svg|ico|webp|wasm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA entry: always serve index.html so hash routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
